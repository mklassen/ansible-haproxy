# tasks file
---
- name: repository | install dependencies (pre)
  ansible.builtin.apt:
    name: "{{ haproxy_dependencies_pre }}"
    state: "{{ apt_install_state | default('latest') }}"
    update_cache: true
    cache_valid_time: "{{ apt_update_cache_valid_time | default(3600) }}"
  tags:
    - haproxy-repository-install-dependencies

- name: repository | cleanup
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items: "{{ haproxy_repository_files_absent }}"
  tags:
    - haproxy-repository-cleanup

- name: repository | add
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: "{{ item.type }}"
    uris: "{{ item.url }}"
    suites: "{{ item.suite }}"
    components: "{{ item.component }}"
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ haproxy_keyring_id }}
    state: "{{ item.state | default('present') }}"
    mode: '0644'
  with_items: "{{ haproxy_repositories }}"
  tags:
    - haproxy-repository-add
  register: haproxy_repositories_add_results

- name: repository | add (update cache)
  ansible.builtin.apt:
    update_cache: true
  tags:
    - haproxy-repository-add
  when: haproxy_repositories_add_results is changed
